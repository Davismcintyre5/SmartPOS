<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="SmartPOS — retail point of sale" />
    <title>SmartPOS</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('smartpos:theme');
          var t = raw ? JSON.parse(raw) : {};
          var mode = t.mode || 'system';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-accent', t.accent || 'blue');
          document.documentElement.setAttribute('data-radius', t.radius || 'md');
          document.documentElement.setAttribute('data-density', t.density || 'comfortable');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
